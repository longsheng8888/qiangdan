name: Build Final Perfect Prefs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos and Tools
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mkdir -p $HOME/theos/sdks
          cp -R sdks-master/iPhoneOS16.5.sdk $HOME/theos/sdks/

      - name: Create Source and Compile (Standalone)
        run: |
          export THEOS=$HOME/theos
          
          # 1. 生成源码
          cat << 'EOF' > GrabPrefsRootListController.m
          #import <Preferences/PSListController.h>
          @interface GrabPrefsRootListController : PSListController
          @end
          @implementation GrabPrefsRootListController
          - (id)specifiers {
              if (_specifiers == nil) {
                  _specifiers = [self loadSpecifiersFromPlistName:@"Root" target:self];
              }
              return _specifiers;
          }
          @end
          EOF

          # 2. 建正确的目录结构
          mkdir -p build_dir/var/jb/Library/PreferenceBundles/GrabPrefs.bundle
          mkdir -p build_dir/var/jb/Library/PreferenceLoader/Preferences
          
          # 3. 手动编译并签名
          xcrun -sdk iphoneos clang -fobjc-arc -dynamiclib \
          -framework Foundation -framework UIKit \
          -Wl,-undefined,dynamic_lookup \
          -I$THEOS/include -I$THEOS/vendor/include \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -arch arm64 -arch arm64e \
          GrabPrefsRootListController.m \
          -o build_dir/var/jb/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefs
          
          chmod 755 build_dir/var/jb/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefs
          ldid -S build_dir/var/jb/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefs

          # 4. 写入带输入框的 Plist
          cat << 'EOF' > build_dir/var/jb/Library/PreferenceBundles/GrabPrefs.bundle/Root.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>cell</key><string>PSGroupCell</string>
                      <key>label</key><string>小龙生抢单参数</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSTextFieldSpecifier</string>
                      <key>label</key><string>最低金额 (元)</string>
                      <key>key</key><string>minFee</string>
                      <key>default</key><string>20</string>
                      <key>KeyboardType</key><string>NumberPad</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSTextFieldSpecifier</string>
                      <key>label</key><string>最大距离 (km)</string>
                      <key>key</key><string>maxDist</string>
                      <key>default</key><string>5</string>
                      <key>KeyboardType</key><string>NumberPad</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSSwitchCell</string>
                      <key>label</key><string>开启自动抢单</string>
                      <key>key</key><string>enabled</string>
                      <key>default</key><true/>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > build_dir/var/jb/Library/PreferenceLoader/Preferences/GrabPrefs.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>entry</key>
              <dict>
                  <key>bundle</key><string>GrabPrefs</string>
                  <key>cell</key><string>PSLinkCell</string>
                  <key>detail</key><string>GrabPrefsRootListController</string>
                  <key>isController</key><string>1</string>
                  <key>label</key><string>小龙生自动抢单</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Build Final Deb (Strict Arm64)
        run: |
          mkdir -p build_dir/DEBIAN
          
          # 强行锁死架构为 iphoneos-arm64，绝对不弹 Patcher
          cat << 'EOF' > build_dir/DEBIAN/control
          Package: com.xiaolong.grabprefs
          Name: 小龙生自动抢单
          Version: 1.0
          Architecture: iphoneos-arm64
          Description: 抢单设置界面
          Maintainer: xiaolong
          Author: xiaolong
          Section: Tweaks
          Depends: mobilesubstrate, preferenceloader
          EOF
          
          # 直接打包，不走 Theos 的打包流程，避开一切自动转换
          dpkg-deb --build --root-owner-group build_dir xiaolong_prefs.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prefs-Deb
          path: xiaolong_prefs.deb
