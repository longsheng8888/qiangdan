name: Build Prefs Deb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos and SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          # 下载官方最新的 SDK 包
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mkdir -p $HOME/theos/sdks
          cp -R sdks-master/* $HOME/theos/sdks/

      - name: Compile Preference Bundle
        run: |
          export THEOS=$HOME/theos
          # 强制使用 16.5 版本的 SDK
          SDK_PATH="$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "Using SDK: $SDK_PATH"
          
          xcrun -sdk iphoneos clang -fobjc-arc -dynamiclib -framework Foundation -framework UIKit -framework Preferences \
          -I$THEOS/include \
          -I$THEOS/vendor/include \
          -isysroot "$SDK_PATH" \
          -arch arm64 -arch arm64e \
          layout/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefsRootListController.m \
          -o layout/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefs

      - name: Build Deb (roothide 路径适配)
        run: |
          mkdir -p build_dir/DEBIAN
          echo "Package: com.xiaolong.grabprefs" > build_dir/DEBIAN/control
          echo "Name: 小龙生自动抢单" >> build_dir/DEBIAN/control
          echo "Version: 1.0" >> build_dir/DEBIAN/control
          echo "Architecture: iphoneos-arm64" >> build_dir/DEBIAN/control
          echo "Description: 设置插件" >> build_dir/DEBIAN/control
          echo "Maintainer: xiaolong" >> build_dir/DEBIAN/control
          echo "Author: xiaolong" >> build_dir/DEBIAN/control
          echo "Section: Tweaks" >> build_dir/DEBIAN/control
          
          # 关键：因为你是 roothide，把设置文件放进 var/jb 目录下才能生效
          mkdir -p build_dir/var/jb/Library
          cp -R layout/Library/* build_dir/var/jb/Library/
          
          dpkg-deb --build --root-owner-group build_dir xiaolong_prefs.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prefs-Deb
          path: xiaolong_prefs.deb
