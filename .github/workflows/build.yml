name: Build Prefs Deb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos and Tools
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mkdir -p $HOME/theos/sdks
          cp -R sdks-master/* $HOME/theos/sdks/

      - name: Create Source and Compile
        run: |
          export THEOS=$HOME/theos
          
          # 1. 生成源码
          cat << 'EOF' > GrabPrefsRootListController.m
          #import <Preferences/PSListController.h>
          @interface GrabPrefsRootListController : PSListController
          @end
          @implementation GrabPrefsRootListController
          - (id)specifiers {
              if (_specifiers == nil) {
                  _specifiers = [self loadSpecifiersFromPlistName:@"Root" target:self];
              }
              return _specifiers;
          }
          @end
          EOF

          # 2. 建目录
          TARGET_DIR="build_dir/var/jb/Library"
          mkdir -p "$TARGET_DIR/PreferenceBundles/GrabPrefs.bundle"
          mkdir -p "$TARGET_DIR/PreferenceLoader/Preferences"
          
          # 3. 编译并链接
          xcrun -sdk iphoneos clang -fobjc-arc -dynamiclib \
          -framework Foundation -framework UIKit \
          -Wl,-undefined,dynamic_lookup \
          -I$THEOS/include -I$THEOS/vendor/include \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -arch arm64 -arch arm64e \
          GrabPrefsRootListController.m \
          -o "$TARGET_DIR/PreferenceBundles/GrabPrefs.bundle/GrabPrefs"
          
          # 4. 写 Plist
          cat << 'EOF' > "$TARGET_DIR/PreferenceBundles/GrabPrefs.bundle/Root.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>cell</key><string>PSGroupCell</string>
                      <key>label</key><string>基本设置</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSTextFieldSpecifier</string>
                      <key>label</key><string>最低金额 (元)</string>
                      <key>key</key><string>minFee</string>
                      <key>default</key><string>7</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSTextFieldSpecifier</string>
                      <key>label</key><string>最大距离 (km)</string>
                      <key>key</key><string>maxDist</string>
                      <key>default</key><string>5</string>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > "$TARGET_DIR/PreferenceLoader/Preferences/GrabPrefs.plist"
          { entry = { bundle = "GrabPrefs"; cell = "PSLinkCell"; label = "小龙生自动抢单"; }; }
          EOF

          # 5. 权限与签名
          chmod 755 "$TARGET_DIR/PreferenceBundles/GrabPrefs.bundle/GrabPrefs"
          ldid -S "$TARGET_DIR/PreferenceBundles/GrabPrefs.bundle/GrabPrefs"

      - name: Build Deb
        run: |
          brew install dpkg
          mkdir -p build_dir/DEBIAN
          
          # 关键修改：加上了 roothide 标识，并且安装路径指定为 var/jb
          cat << 'EOF' > build_dir/DEBIAN/control
          Package: com.xiaolong.grabprefs
          Name: 小龙生自动抢单
          Version: 1.0
          Architecture: iphoneos-arm64
          Description: 设置插件
          Maintainer: xiaolong
          Author: xiaolong
          Section: Tweaks
          Depends: mobilesubstrate, preferenceloader
          THEOS_PACKAGE_SCHEME: roothide
          EOF
          
          dpkg-deb --build --root-owner-group build_dir xiaolong_prefs.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prefs-Deb
          path: xiaolong_prefs.deb
