name: Build Prefs Deb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mkdir -p $HOME/theos/sdks
          cp -R sdks-master/* $HOME/theos/sdks/

      - name: Fix UIBarButtonItemStyleDone warning
        run: |
          sed -i '' 's/UIBarButtonItemStyleDone/UIBarButtonItemStyleProminent/g' layout/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefsRootListController.m

      - name: Compile Bundle (roothide 适配)
        run: |
          export THEOS=$HOME/theos
          xcrun -sdk iphoneos clang -fobjc-arc -dynamiclib \
          -framework Foundation -framework UIKit \
          -Wl,-undefined,dynamic_lookup \
          -I$THEOS/include \
          -I$THEOS/vendor/include \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -arch arm64 -arch arm64e \
          layout/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefsRootListController.m \
          -o layout/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefs

      - name: Build Deb (roothide 终极适配)
        run: |
          brew install dpkg
          
          mkdir -p build_dir/DEBIAN
          cat << 'EOF' > build_dir/DEBIAN/control
          Package: com.xiaolong.grabprefs
          Name: 小龙生自动抢单
          Version: 1.0
          Architecture: iphoneos-arm64
          Description: 设置插件
          Maintainer: xiaolong
          Author: xiaolong
          Section: Tweaks
          Depends: mobilesubstrate, preferenceloader
          EOF
          
          # 创建标准的 var/jb 目录
          mkdir -p build_dir/var/jb
          cp -R layout/Library build_dir/var/jb/
          
          # 在你的系统里强制找到那个 .jbroot 目录并建立一个同名映射
          # 这样就算是 roothide 的特殊的映射，也能直接读到
          mkdir -p build_dir/var/containers/Bundle/Application/.jbroot-58FB2198093DD2FC/Library
          cp -R layout/Library build_dir/var/containers/Bundle/Application/.jbroot-58FB2198093DD2FC/Library/
          
          dpkg-deb --build --root-owner-group build_dir xiaolong_prefs.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prefs-Deb
          path: xiaolong_prefs.deb
