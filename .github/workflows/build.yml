name: Build Real RootHide Deb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos and RootHide Tools
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mkdir -p $HOME/theos/sdks
          cp -R sdks-master/iPhoneOS16.5.sdk $HOME/theos/sdks/
          
          # 关键：拉取 roothide 官方补丁包
          git clone https://github.com/roothide/roothide-package.git $HOME/roothide-package

      - name: Create Source and Compile
        run: |
          export THEOS=$HOME/theos
          export THEOS_PACKAGE_SCHEME=roothide
          export PATH=$THEOS/bin:$PATH
          
          cat << 'EOF' > GrabPrefsRootListController.m
          #import <Preferences/PSListController.h>
          @interface GrabPrefsRootListController : PSListController
          @end
          @implementation GrabPrefsRootListController
          - (id)specifiers {
              if (_specifiers == nil) {
                  _specifiers = [self loadSpecifiersFromPlistName:@"Root" target:self];
              }
              return _specifiers;
          }
          @end
          EOF

          mkdir -p layout/Library/PreferenceBundles/GrabPrefs.bundle
          mkdir -p layout/Library/PreferenceLoader/Preferences
          
          xcrun -sdk iphoneos clang -fobjc-arc -dynamiclib \
          -framework Foundation -framework UIKit \
          -Wl,-undefined,dynamic_lookup \
          -I$THEOS/include -I$THEOS/vendor/include \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -arch arm64 -arch arm64e \
          GrabPrefsRootListController.m \
          -o layout/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefs
          
          chmod 755 layout/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefs
          ldid -S layout/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefs
          
          # 自动生成之前的 plist（略过，用之前的即可）
          # 直接把 plist 写在这里...

      - name: Build RootHide Deb
        run: |
          # 使用 roothide 官方提供的脚本进行打补丁和打包
          export THEOS_PACKAGE_SCHEME=roothide
          
          mkdir -p build_dir/DEBIAN
          mkdir -p build_dir/var/jb
          
          cp -R layout/Library build_dir/var/jb/
          
          cat << 'EOF' > build_dir/DEBIAN/control
          Package: com.xiaolong.grabprefs
          Name: 小龙生自动抢单
          Version: 1.0
          Architecture: iphoneos-arm64
          Description: 抢单设置
          Maintainer: xiaolong
          Author: xiaolong
          Section: Tweaks
          Depends: mobilesubstrate, preferenceloader
          EOF
          
          # 核心：用 roothide 官方工具打上签名补丁！
          $HOME/roothide-package/roothide-patcher/patcher build_dir/var/jb/Library/PreferenceBundles/GrabPrefs.bundle/GrabPrefs
          
          dpkg-deb --build --root-owner-group build_dir xiaolong_prefs.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prefs-Deb
          path: xiaolong_prefs.deb
