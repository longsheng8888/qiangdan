name: Build Real Theos Prefs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mkdir -p $HOME/theos/sdks
          cp -R sdks-master/iPhoneOS16.5.sdk $HOME/theos/sdks/

      - name: Create Standard Theos Project
        run: |
          # 1. 在根目录生成 Makefile，强制使用 iphoneos-arm64
          cat << 'EOF' > Makefile
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:16.5:14.0
          INSTALL_TARGET_PROCESSES = Preferences

          include $(THEOS)/makefiles/common.mk

          BUNDLE_NAME = GrabPrefs
          GrabPrefs_FILES = GrabPrefsRootListController.m
          GrabPrefs_FRAMEWORKS = UIKit Foundation
          GrabPrefs_PRIVATE_FRAMEWORKS = Preferences
          GrabPrefs_INSTALL_PATH = /Library/PreferenceBundles
          GrabPrefs_CFLAGS = -fobjc-arc

          include $(THEOS_MAKE_PATH)/bundle.mk
          EOF

          # 2. 生成源码
          cat << 'EOF' > GrabPrefsRootListController.m
          #import <Preferences/PSListController.h>
          @interface GrabPrefsRootListController : PSListController
          @end
          @implementation GrabPrefsRootListController
          - (id)specifiers {
              if (_specifiers == nil) {
                  _specifiers = [self loadSpecifiersFromPlistName:@"Root" target:self];
              }
              return _specifiers;
          }
          @end
          EOF

          # 3. 生成带输入框的 Root.plist
          cat << 'EOF' > Root.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>cell</key><string>PSGroupCell</string>
                      <key>label</key><string>小龙生抢单参数</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSTextFieldSpecifier</string>
                      <key>label</key><string>最低金额 (元)</string>
                      <key>key</key><string>minFee</string>
                      <key>default</key><string>20</string>
                      <key>KeyboardType</key><string>NumberPad</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSTextFieldSpecifier</string>
                      <key>label</key><string>最大距离 (km)</string>
                      <key>key</key><string>maxDist</string>
                      <key>default</key><string>5</string>
                      <key>KeyboardType</key><string>NumberPad</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSSwitchCell</string>
                      <key>label</key><string>开启自动抢单</string>
                      <key>key</key><string>enabled</string>
                      <key>default</key><true/>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          # 4. 生成入口文件
          mkdir -p layout/Library/PreferenceLoader/Preferences
          cat << 'EOF' > layout/Library/PreferenceLoader/Preferences/GrabPrefs.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>entry</key>
              <dict>
                  <key>bundle</key><string>GrabPrefs</string>
                  <key>cell</key><string>PSLinkCell</string>
                  <key>detail</key><string>GrabPrefsRootListController</string>
                  <key>isController</key><string>1</string>
                  <key>label</key><string>小龙生自动抢单</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Compile with Theos
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make package FINALPACKAGE=1

      - name: Build Final Deb with Correct Architecture
        run: |
          # 解压 Theos 编译出来的 deb，重新打上 iphoneos-arm64 标识
          mkdir -p extract
          find .theos -name "*.deb" -exec dpkg-deb -x {} extract/ \;
          
          mkdir -p build_dir/DEBIAN
          cat << 'EOF' > build_dir/DEBIAN/control
          Package: com.xiaolong.grabprefs
          Name: 小龙生自动抢单
          Version: 1.0
          Architecture: iphoneos-arm64
          Description: 抢单设置界面
          Maintainer: xiaolong
          Author: xiaolong
          Section: Tweaks
          Depends: mobilesubstrate, preferenceloader
          EOF
          
          # 复制编译好的文件（Theos 会自动放进 layout 或 rootless 目录）
          cp -R extract/Library build_dir/
          # 如果是 rootless 编译出来的，把 var/jb 里的移出来
          if [ -d "extract/var/jb/Library" ]; then
            mkdir -p build_dir/var/jb
            cp -R extract/var/jb/Library build_dir/var/jb/
            rm -rf build_dir/Library
          fi
          
          dpkg-deb --build --root-owner-group build_dir xiaolong_prefs.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prefs-Deb
          path: xiaolong_prefs.deb
